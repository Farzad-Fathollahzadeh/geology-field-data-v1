name: Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Restoring Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          echo "Decoding and restoring debug keystore..."
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "No debug.keystore.base64 found, a fresh debug keystore will be generated."
        fi

    - name: Set up Gradle and Build APK
      uses: gradle/actions/setup-gradle@v3
      with:
        arguments: assembleDebug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeoFieldPro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
